{% extends "base.html" %}
{% block title %}New Assessment — {{ course.code }}{% endblock %}
{% block content %}
<div class="eyebrow"><a href="{{ url_for('lecturer_assessments', course_id=course.id) }}">← Assessments</a></div>
<div class="page-title"><h1>New assessment — {{ course.code }}</h1></div>

<div class="panel" style="max-width:480px;">
  <form method="post">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Quiz 2, Midterm Exam" required>
    </div>
    <div class="field">
      <label for="assessment_type">Type</label>
      <select id="assessment_type" name="assessment_type" style="width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:3px;">
        {% for t in types %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="sequence">Sequence (order in the term)</label>
      <input type="number" id="sequence" name="sequence" min="1" value="{{ suggested_seq }}">
    </div>
    <div class="field">
      <label for="max_score">Max score</label>
      <input type="number" id="max_score" name="max_score" min="1" value="100" step="0.5">
    </div>
    <div class="btn-row">
      <button class="btn" type="submit">Create &amp; enter grades</button>
      <a class="btn secondary" href="{{ url_for('lecturer_assessments', course_id=course.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
