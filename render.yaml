databases:
  - name: risk-system-db
    plan: basic-256mb
    databaseName: risk_system
    user: risk_system

services:
  - type: web
    name: risk-system
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: risk-system-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
